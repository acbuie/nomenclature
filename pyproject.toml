[project]
name = "nomenclature"
version = "0.1.0"
description = "A web scraper to fetch feature geometries from the Gazetteer of Planetary Nomenclature."
readme = "README.md"
authors = [
    { name = "acbuie", email = "aidancbuie@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "beautifulsoup4>=4.15.0",
    "fudgeo>=1.5.10",
    "shapely>=2.2.0",
]

[project.scripts]
nomenclature = "nomenclature:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.103",
]
